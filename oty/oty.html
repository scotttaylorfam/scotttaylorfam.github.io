<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Podcast Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5dc;
    }
    header {
      text-align: center;
      padding: 20px;
      background: #333;
      color: white;
    }
    #searchBar {
      width: 80%;
      max-width: 500px;
      padding: 10px;
      margin: 15px auto;
      display: block;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .section {
      margin: 30px 0;
    }
    .section h2 {
      margin-left: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .video {
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
    }
    .video:hover {
      transform: scale(1.05);
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    .title {
      margin-top: 8px;
      font-size: 14px;
    }
    #player {
      width: 100%;
      max-width: 800px;
      margin: 20px auto;
    }
    iframe {
      width: 100%;
      height: 450px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Podcast Library</h1>
  <p>Click a video to play</p>
</header>

<input type="text" id="searchBar" placeholder="Search all videos..." />

<div id="player"></div>

<div id="content"></div>

<script>
const API_KEY = "YOUR_YOUTUBE_API_KEY";

const PLAYLISTS = [
  { id: "PLRo8KAepAcrYmnjV7o3hVeJqRPKroZ6wU", name: "Old Testament Follow Him" },
  { id: "PLhfh21X9suLdKQnmdWchUDR0b8QEB7iS6", name: "Playlist 2" },
  { id: "PLhfh21X9suLdFq2rbJ5yhk-gqqNWauzgx", name: "Playlist 3" },
  { id: "PLhfh21X9suLeJgxN1WpXSDs5RFKCU4601", name: "Playlist 4" },
  { id: "PLCmB7Fm5GlgMaBvqZAUev22TwkltLFBV9", name: "Playlist 5" },
  { id: "PLCmB7Fm5GlgOpqaMPH6xnswvPmWDxrcXK", name: "Playlist 6" },
  { id: "PLCmB7Fm5GlgOSKBSVUPjzkQMm8Yosm1gv", name: "Playlist 7" }
];

const content = document.getElementById("content");
const player = document.getElementById("player");
const searchBar = document.getElementById("searchBar");

let allVideos = [];
let sections = [];

async function fetchPlaylist(playlist) {
  let videos = [];
  let nextPageToken = "";

  do {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlist.id}&key=${API_KEY}&pageToken=${nextPageToken}`;

    const res = await fetch(url);
    const data = await res.json();

    data.items.forEach(item => {
      if (!item.snippet.resourceId) return;

      const video = {
        id: item.snippet.resourceId.videoId,
        title: item.snippet.title,
        playlist: playlist.name
      };

      videos.push(video);
      allVideos.push(video);
    });

    nextPageToken = data.nextPageToken;
  } while (nextPageToken);

  sections.push({ name: playlist.name, videos });
}

async function loadAll() {
  for (const playlist of PLAYLISTS) {
    await fetchPlaylist(playlist);
  }
  renderSections(sections);
}

function renderSections(sectionData) {
  content.innerHTML = "";

  sectionData.forEach(section => {
    const sectionDiv = document.createElement("div");
    sectionDiv.className = "section";

    const title = document.createElement("h2");
    title.innerText = section.name;

    const grid = document.createElement("div");
    grid.className = "grid";

    section.videos.forEach(video => {
      const videoDiv = document.createElement("div");
      videoDiv.className = "video";

      const img = document.createElement("img");
      img.src = `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;

      const vidTitle = document.createElement("div");
      vidTitle.className = "title";
      vidTitle.innerText = video.title;

      videoDiv.appendChild(img);
      videoDiv.appendChild(vidTitle);

      videoDiv.onclick = () => {
        player.innerHTML = `<iframe src="https://www.youtube.com/embed/${video.id}" allowfullscreen></iframe>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      grid.appendChild(videoDiv);
    });

    sectionDiv.appendChild(title);
    sectionDiv.appendChild(grid);
    content.appendChild(sectionDiv);
  });
}

// 🔎 Search across all playlists
searchBar.addEventListener("input", () => {
  const term = searchBar.value.toLowerCase();

  if (!term) {
    renderSections(sections);
    return;
  }

  const filteredSections = sections.map(section => ({
    name: section.name,
    videos: section.videos.filter(v => v.title.toLowerCase().includes(term))
  }));

  renderSections(filteredSections);
});

loadAll();
</script>

</body>
</html>
